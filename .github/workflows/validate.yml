name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace, plugin manifest and skills frontmatter
        run: bash scripts/validate-skills.sh
      - name: Shellcheck (instalador + scripts)
        run: shellcheck -S warning instalar_imersao.sh scripts/*.sh
