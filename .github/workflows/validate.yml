name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace, plugin manifest and skills frontmatter
        run: bash scripts/validate-skills.sh
      - name: Invariantes da Fase 1 (pg-imersao-prd)
        run: bash scripts/check-fase1.sh
      - name: Invariantes da Fase 3 (implementar + toques prd/publicar)
        run: bash scripts/check-fase3.sh
      - name: Shellcheck (instalador + scripts)
        run: shellcheck -S warning instalar_imersao.sh scripts/*.sh
